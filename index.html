<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Code-Lifter Hub</title>
    
    <!-- External Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- ==========================================
         CUSTOM STYLES
         ========================================== -->
    <style>
      /* --- Fonts --- */
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Lato:wght@400;700&display=swap");

      /* --- App Shell & Base Setup --- */
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        overflow: hidden; /* Lock body scroll */
        background-color: #1c1917;
        background-image: radial-gradient(circle at center, #292524 0%, #1c1917 100%);
        font-family: "Lato", sans-serif;
        color: #d6d3d1;
      }

      /* --- Typography --- */
      h1, h2, .fantasy-font {
        font-family: "Cinzel", serif;
      }

      /* --- Gradients from Original App --- */
      .bg-red { background: linear-gradient(135deg, #ff3b30, #ff2d55); }
      .bg-orange { background: linear-gradient(135deg, #ff9500, #ffcc00); }
      .bg-green { background: linear-gradient(135deg, #34c759, #30d158); }
      .bg-blue { background: linear-gradient(135deg, #007aff, #05a1ff); }
      .bg-indigo { background: linear-gradient(135deg, #5856d6, #5e5ce6); }
      .bg-teal { background: linear-gradient(135deg, #30beca, #5ac8fa); }
      .bg-pink { background: linear-gradient(135deg, #ff2d55, #ff375f); }
      .bg-gray { background: linear-gradient(135deg, #8e8e93, #636366); }

      /* --- Custom Scrollbar (Grid Area) --- */
      .custom-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: #292524;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background: #57534e;
        border-radius: 3px;
      }
      .custom-scroll::-webkit-scrollbar-thumb:hover {
        background: #78716c;
      }

      /* --- Components: Game Cards --- */
      .game-card {
        transition: all 0.2s ease-out;
        border: 1px solid #44403c;
      }
      .game-card:hover {
        transform: translateY(-2px);
        border-color: #f59e0b;
        background-color: #292524;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      }
      .game-card:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  
  <body class="flex flex-col">
    
    <!-- ==========================================
         HEADER
         ========================================== -->
    <header class="h-[10dvh] min-h-[60px] flex items-center justify-center bg-stone-900 border-b-4 border-amber-700 shadow-xl z-40 shrink-0 relative">
      <h1 class="text-amber-500 font-bold tracking-widest uppercase drop-shadow-md" style="font-size: min(6vw, 4vh)">
        Code-Lifter Hub
      </h1>
    </header>

    <!-- ==========================================
         MAIN CONTENT AREA
         ========================================== -->
    <main class="flex-grow overflow-y-auto custom-scroll relative">
        
      <!-- --- Sticky Search Bar Section --- -->
      <div class="sticky top-0 z-30 pt-3 pb-3 px-3 sm:px-8 border-b border-stone-800 shadow-sm" style="background-color: rgba(28, 25, 23, 0.95); backdrop-filter: blur(8px);">
        <div class="relative max-w-md mx-auto">
            <!-- Search Icon -->
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-4 w-4 sm:h-5 sm:w-5 text-stone-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </div>
            <!-- Search Input -->
            <input 
                type="text" 
                id="gameSearch" 
                placeholder="Find a module..." 
                class="block w-full pl-9 sm:pl-10 pr-3 py-1.5 sm:py-3 border border-stone-600 rounded-xl leading-5 bg-stone-800 text-stone-200 placeholder-stone-500 focus:outline-none focus:bg-stone-900 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-xs sm:text-base transition-colors shadow-lg"
            >
        </div>
      </div>

      <!-- --- Cards Grid Container --- -->
      <div class="p-3 sm:p-8 max-w-[1400px] mx-auto">
        <!-- Grid: 3 cols on small screens, scaling up for tablet/desktop -->
        <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2 sm:gap-5">
          
          <!-- Fitness -->
          <a href="https://code-lifter.github.io/Fitness/" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">
            <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>
            <div class="w-full aspect-square bg-orange relative flex items-center justify-center p-2">
              <svg class="w-8 h-8 sm:w-16 sm:h-16 text-white drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            </div>
            <div class="p-1.5 sm:p-3 flex-grow flex items-center justify-center text-center bg-stone-800 border-t border-stone-700 z-20">
              <h2 class="fantasy-font text-xs sm:text-base font-bold text-stone-200 group-hover:text-amber-500 transition-colors leading-tight">
                Fitness
              </h2>
            </div>
          </a>
          
          <!-- Score Board Game Hub -->
          <a href="https://code-lifter.github.io/Score-board-game-hub/" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">
            <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>
            <div class="w-full aspect-square bg-indigo relative flex items-center justify-center p-2">
              <svg class="w-8 h-8 sm:w-16 sm:h-16 text-white drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.26a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <div class="p-1.5 sm:p-3 flex-grow flex items-center justify-center text-center bg-stone-800 border-t border-stone-700 z-20">
              <h2 class="fantasy-font text-xs sm:text-base font-bold text-stone-200 group-hover:text-amber-500 transition-colors leading-tight">
                Score Board
              </h2>
            </div>
          </a>

          <!-- Mental -->
          <a href="https://code-lifter.github.io/Mental/" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">
            <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>
            <div class="w-full aspect-square bg-teal relative flex items-center justify-center p-2">
              <svg class="w-8 h-8 sm:w-16 sm:h-16 text-white drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
            </div>
            <div class="p-1.5 sm:p-3 flex-grow flex items-center justify-center text-center bg-stone-800 border-t border-stone-700 z-20">
              <h2 class="fantasy-font text-xs sm:text-base font-bold text-stone-200 group-hover:text-amber-500 transition-colors leading-tight">
                Mental
              </h2>
            </div>
          </a>

          <!-- Life -->
          <a href="https://code-lifter.github.io/Life/" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">
            <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>
            <div class="w-full aspect-square bg-green relative flex items-center justify-center p-2">
              <svg class="w-8 h-8 sm:w-16 sm:h-16 text-white drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
            </div>
            <div class="p-1.5 sm:p-3 flex-grow flex items-center justify-center text-center bg-stone-800 border-t border-stone-700 z-20">
              <h2 class="fantasy-font text-xs sm:text-base font-bold text-stone-200 group-hover:text-amber-500 transition-colors leading-tight">
                Life
              </h2>
            </div>
          </a>

          <!-- Tennis -->
          <a href="https://code-lifter.github.io/Tennis/" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">
            <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>
            <div class="w-full aspect-square bg-pink relative flex items-center justify-center p-2">
              <svg class="w-8 h-8 sm:w-16 sm:h-16 text-white drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <div class="p-1.5 sm:p-3 flex-grow flex items-center justify-center text-center bg-stone-800 border-t border-stone-700 z-20">
              <h2 class="fantasy-font text-xs sm:text-base font-bold text-stone-200 group-hover:text-amber-500 transition-colors leading-tight">
                Tennis
              </h2>
            </div>
          </a>
          
        </div>
      </div>
    </main>

    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->
    <script>
        // Listen for user typing in the search bar
        document.getElementById('gameSearch').addEventListener('input', function(e) {
            // Get the user's input and convert to lowercase for case-insensitive matching
            const searchTerm = e.target.value.toLowerCase();
            // Select all game card anchor tags
            const cards = document.querySelectorAll('.game-card');

            cards.forEach(card => {
                // Find the game title text inside the card's <h2> element
                const title = card.querySelector('h2').innerText.toLowerCase();
                
                // Toggle card visibility based on whether the title includes the search string
                if (title.includes(searchTerm)) {
                    card.classList.remove('hidden');
                    card.classList.add('flex'); // Restore the required flex layout class
                } else {
                    card.classList.add('hidden'); // Hide unmatched cards
                    card.classList.remove('flex');
                }
            });
        });
    </script>
  </body>
</html>
